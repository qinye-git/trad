<div class="app">
<div class="header">
  <div class="logo"><div class="logo-mark">Q</div><div class="logo-text"><span>A股</span>量化筛选系统</div></div>
  <div style="display:flex;align-items:center;gap:16px;">
    <div class="status-pill"><span class="dot" id="dot"></span><span id="task-status">空闲</span></div>
    <div class="header-meta" id="header-meta"></div>
  </div>
</div>
<div class="body">

<div class="sidebar">
  <div class="side-section">
    <div class="side-title">筛选操作</div>
    <button class="btn primary" id="btn-screen" onclick="runScreen()">▶ 开始筛选</button>
    <button class="btn" id="btn-screen-full" onclick="runScreenFull()">↻ 更新池并筛选</button>
    <button class="btn" id="btn-update" onclick="updateCodes()">↓ 仅更新股票池</button>
    <button class="btn danger disabled" id="btn-cancel" onclick="cancelTask()">■ 停止任务</button>
  </div>

  <div class="side-section">
    <div class="side-title">市场行情</div>
    <div id="index-bar" style="display:flex;flex-direction:column;gap:6px;">
      <div class="index-item" id="idx-sh">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;color:var(--text2);">上证指数</span>
          <span class="idx-chg" id="idx-sh-chg" style="font-size:11px;">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span class="idx-price" id="idx-sh-price" style="font-size:18px;font-weight:600;letter-spacing:0.5px;">--</span>
          <span class="idx-pct" id="idx-sh-pct" style="font-size:12px;font-weight:600;">--</span>
        </div>
      </div>
      <div class="index-item" id="idx-sz">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;color:var(--text2);">深证成指</span>
          <span class="idx-chg" id="idx-sz-chg" style="font-size:11px;">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;">
          <span class="idx-price" id="idx-sz-price" style="font-size:16px;font-weight:600;letter-spacing:0.5px;">--</span>
          <span class="idx-pct" id="idx-sz-pct" style="font-size:12px;font-weight:600;">--</span>
        </div>
      </div>
      <div style="font-size:10px;color:var(--text3);text-align:right;margin-top:2px;" id="idx-update-time">--</div>
    </div>
  </div>

  <div class="side-section">
    <div class="side-title">筛选模式</div>
    <div class="mode-switch">
      <div class="mode-btn" id="mode-strict" onclick="applyPreset('strict')">严格</div>
      <div class="mode-btn" id="mode-normal" onclick="applyPreset('normal')">标准</div>
      <div class="mode-btn active" id="mode-loose" onclick="applyPreset('loose')">宽松</div>
    </div>
    <div class="param-group">
      <div class="param-label"><span>跑赢基准（%）</span><span class="param-val" id="v-benchmark"></span></div>
      <input type="range" id="r-benchmark" min="-3" max="5" step="0.5" oninput="syncUI()">
    </div>
    <div class="param-group">
      <div class="param-label"><span>10日上涨天数 ≥</span><span class="param-val" id="v-updays"></span></div>
      <input type="range" id="r-updays" min="1" max="9" step="1" oninput="syncUI()">
    </div>
    <div class="param-group">
      <div class="param-label"><span>量比下限</span><span class="param-val" id="v-volmin"></span></div>
      <input type="range" id="r-volmin" min="0.5" max="1.5" step="0.05" oninput="syncUI()">
    </div>
    <div class="param-group">
      <div class="param-label"><span>最低得分 ≥</span><span class="param-val" id="v-score"></span></div>
      <input type="range" id="r-score" min="0" max="5" step="1" oninput="syncUI()">
    </div>
    <div class="toggle-row">
      <span>要求站上MA20</span>
      <label class="toggle"><input type="checkbox" id="t-ma20" onchange="syncUI()"><span class="toggle-slider"></span></label>
    </div>
    <div class="param-label" style="margin-bottom:5px">最低评级</div>
    <select class="grade-select" id="s-grade" onchange="syncUI()">
      <option value="A">A级（成交额≥500万）</option>
      <option value="B" selected>B级（含低流动性）</option>
    </select>
    <button class="apply-btn" onclick="saveParams()">✓ 应用参数</button>
    <div class="save-hint" id="save-hint"></div>
  </div>

  <div class="side-section">
    <div class="side-title">数据状态</div>
    <div class="info-card">
      <div class="info-row"><span class="info-key">股票池数量</span><span class="info-val accent" id="s-count">--</span></div>
      <div class="info-row"><span class="info-key">更新时间</span><span class="info-val" id="s-mtime" style="font-size:10px">--</span></div>
      <div class="info-row"><span class="info-key">上次入选</span><span class="info-val green" id="s-picked">--</span></div>
    </div>
    <button class="btn" onclick="openResultFile()" style="margin-top:8px;font-size:11px">↗ 用系统程序打开摘要</button>
    <button class="btn" onclick="viewSummaryInApp()" style="font-size:11px">☰ 在窗口内查看摘要</button>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <div class="tab active" id="tab-btn-results" onclick="switchTab('results')">筛选结果 <span class="tab-badge" id="badge-results">0</span></div>
    <div class="tab" id="tab-btn-log" onclick="switchTab('log')">运行日志</div>
    <div class="tab" id="tab-btn-summary" onclick="switchTab('summary')">摘要报告</div>
  </div>
  <div class="tab-content active" id="tab-results">
    <div class="results-wrap">
      <div class="empty-state" id="results-empty"><div class="empty-icon">📈</div><div>点击「开始筛选」运行全市场量化筛选</div></div>
      <div id="results-content" style="display:none">
        <div class="result-meta" id="result-meta"></div>
        <table>
          <thead><tr>
            <th>#</th><th>代码</th><th>名称</th><th>评级</th><th>得分</th>
            <th>5日超额</th><th>ADV5成交</th><th>MA20</th><th>跌停(60d)</th>
          </tr></thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="tab-content" id="tab-log">
    <div id="progress-bar-wrap" style="display:none;padding:10px 16px 0;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px;">
        <span id="progress-label">筛选进度</span>
        <span id="progress-pct">0%</span>
      </div>
      <div style="background:var(--bg3);border-radius:4px;height:6px;overflow:hidden;">
        <div id="progress-fill" style="height:100%;width:0%;background:var(--red);border-radius:4px;transition:width .3s;"></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px;" id="progress-sub"></div>
    </div>
    <div class="log-wrap" id="log-wrap"><div class="log-line dim">运行日志将在此显示...</div></div>
  </div>
  <div class="tab-content" id="tab-summary">
    <div class="results-wrap" id="summary-wrap">
      <div class="empty-state" id="summary-empty"><div class="empty-icon">📄</div><div>点击「在窗口内查看摘要」或运行筛选后自动加载</div></div>
      <pre id="summary-content" style="display:none;color:var(--text);font-family:'Courier New',monospace;font-size:12px;line-height:1.8;white-space:pre-wrap;"></pre>
    </div>
  </div>
</div>

</div>
<div class="bottombar">
  <span>数据来源: 新浪行情 / 腾讯 fqkline</span>
  <span id="bottom-time"></span>
</div>
</div>
